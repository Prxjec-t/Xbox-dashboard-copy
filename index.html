<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Xbox home page</title>
  </head>
  <body>
    <header>
      <div class="user-container">
        <img src="/img/xbox-pfp.jpg" alt="Xbox profile picture of a monkey" class="pfp" />
        <div class="user-info">
          <p class="username">Username</p>
          <div class="gamescore-container">
            <p class="gamescore-icon">G</p>
            <p class="gamescore">21,337</p>
            <!-- <p class="gamescore">G 21,337</p> -->
          </div>
        </div>
      </div>

      <div class="menu-buttons">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="system-info">
        <span class="dot"></span>
        <span class="dot"></span>
        <p class="time">13:37</p>
      </div>
    </header>
    <main>
      <div class="games">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>

      <div class="info">
        <div class="rectangle"></div>
        <div class="rectangle"></div>
        <div class="rectangle"></div>
        <div class="rectangle"></div>
      </div>
    </main>

    <script src="/js/main.js"></script>
  </body>
</html>
